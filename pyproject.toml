[project]
name = "shopping-agent"
version = "0.1.0"
description = "Turns a natural-language shopping list into the cheapest basket across nearby Israeli supermarkets."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shopping_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
