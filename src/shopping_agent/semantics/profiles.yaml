# Category default profiles (architecture section 3.1).
#
# One profile per high-frequency household staple. Each profile has:
#   keywords          a product or list item belongs to the category when its name starts with one
#   exclude_keywords  ...and none of these words appears in it
#   defaults          attribute values assumed when the user did not state them (hard filters)
#   free              attributes where any value is accepted, so the cheapest wins
#   typical_pack      the usual pack, in ml, g or unit
# A weighed category (sold by the kilogram) also has:
#   weighed: true
#   typical_unit_weight   the weight of one piece, in g
#
# The file is checked by shopping_agent.semantics.profiles; see docs/category-profiles.md.

# --- Dairy and eggs ---------------------------------------------------------

milk:
  keywords: [חלב]
  exclude_keywords: [סויה, קוקוס, שוקולד, אבקת, עיזים, מרוכז, שקדים, שיבולת, אורז, וניל, להקצפה, עזים, לוז, קפה, בטעם]
  defaults: {animal: cow, flavor: plain, storage: fresh}
  free: [fat_pct, brand]
  typical_pack: {value: 1000, unit: ml}

cottage:
  keywords: [קוטג', קוטג]
  exclude_keywords: [זיתים, שום, שמיר, בצל]
  defaults: {flavor: plain}
  free: [fat_pct, brand]
  typical_pack: {value: 250, unit: g}

